name: Build Site and CV

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/cv-build.yml'
      - 'Makefile'
      - '.nvmrc'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/cv-build.yml'
      - 'Makefile'
      - '.nvmrc'
  workflow_dispatch:

# Serialize runs so two builds don't try to commit the regenerated CV to the
# same branch at once (the second push would be rejected with "fetch first").
concurrency:
  group: build-site-and-cv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast pre-merge check: build the Astro site and check internal links/images.
  # No CV/LaTeX or deploy steps — those only run on master (see the build job).
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install site dependencies
        working-directory: docs
        run: npm ci

      - name: Build Astro site
        working-directory: docs
        run: npm run build

      - name: Check internal links and images
        working-directory: docs
        run: npm run check-links

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install site dependencies
        working-directory: docs
        run: npm ci

      - name: Install TeX Live and xelatex
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra
          sudo apt-get install -y fonts-roboto fonts-font-awesome
          xelatex --version

      - name: Build CV
        run: |
          make clean
          make cv

      - name: Commit CV
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          git add docs/static/public/Alessandro_Sanvito_CV.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update CV"
          # The remote branch may have advanced since checkout (e.g. concurrent
          # pushes). Rebase onto the latest remote tip and retry the push a few
          # times so the build artifact lands without failing the run.
          branch='${{ github.ref_name }}'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$branch"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/$branch and retrying"
            git fetch origin "$branch"
            git rebase "origin/$branch"
            sleep $((attempt * 2))
          done
          echo "Failed to push CV update after multiple attempts"
          exit 1

      - name: Build Astro site
        working-directory: docs
        run: npm run build

      - name: Check internal links and images
        working-directory: docs
        run: npm run check-links

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  # Publishes the artifact from `build` straight to GitHub Pages (repo setting:
  # Pages > Source = GitHub Actions). Nothing is committed to a branch. Only
  # master deploys; the github-pages environment rejects other branches anyway.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
