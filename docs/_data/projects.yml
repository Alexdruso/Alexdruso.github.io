# Source of truth for the website's projects page.
# Curated list of GitHub repositories Alessandro meaningfully contributed to —
# an ongoing Kaggle Playground Series project, coursework from PoliMi and KTH, two ACM
# RecSys Challenge entries, a hackathon, and this site itself. Forks and
# throwaway sandboxes are intentionally excluded.
# Sorted reverse-chronologically; the projects page renders this order as-is.

- title: "Kaggle Playground Series — ongoing"
  repo: "https://github.com/Alexdruso/data-science-stuff"
  year: 2026
  period: "2025 – present"
  role: "Solo"
  context: "Kaggle Playground Series, monthly tabular competitions"
  description: "A running series of Kaggle Playground entries, all living in one monorepo. The machinery every competition shares is factored into an installable `data_science_stuff.kaggle` package — the cross-validation fold loop, Nelder-Mead blend weights, fold-safe target encoding, stacking with Caruana selection, threshold and cost-matrix decision rules, and a LightGBM CUDA probe — gated in CI by `ruff`, `mypy --strict`, `bandit` and 80% coverage. Recurring themes: adversarial validation to check that CV gains transfer to the test distribution, and picking final submissions by cross-validation rather than public rank."
  tags: ["Python", "LightGBM", "XGBoost", "CatBoost", "PyTorch", "Polars", "Optuna"]
  entries:
    - name: "S6E7 — Student health risk (in progress)"
      url: "https://github.com/Alexdruso/data-science-stuff/tree/main/playground-series-s6e7"
      summary: "Three-class, balanced-accuracy task with missing values in every feature. A decision-corrected GBDT blend at 0.9497 public; adversarial-validation-weighted OOF vetoes candidates whose gains sit outside the test-like region."
    - name: "S6E6 — Stellar class, 12th / 2,817"
      url: "https://github.com/Alexdruso/data-science-stuff/tree/main/playground-series-s6e6"
      summary: "Up from 407th public. Diverse models — quantile-bin target encoding, a from-scratch RealMLP on a logit-adjusted loss, a QSO/STAR cascade — took a 0.9662 GBDT plateau to ~0.9705."
    - name: "S6E5 — F1 pit-stop prediction"
      url: "https://github.com/Alexdruso/data-science-stuff/tree/main/playground-series-s6e5"
      summary: "Found a 2023 labelling anomaly (0.96% pit rate vs ~28%) and fitted separate blend weights either side of it over LightGBM, XGBoost, CatBoost and MLP bases; 0.9508 OOF AUC."
    - name: "S6E4 — Irrigation need"
      url: "https://github.com/Alexdruso/data-science-stuff/tree/main/playground-series-s6e4"
      summary: "Used the community-reconstructed generator formula (credit: Chris Deotte) as predictor, feature and residual base for LightGBM, with decision-threshold tuning."
    - name: "S5E1, S5E5, S5E6 — 2025 season"
      url: "https://github.com/Alexdruso/data-science-stuff"
      summary: "Sticker-sales forecasting, calorie-expenditure regression and MAP@3 fertilizer recommendation — where the shared workflow first took shape."

