# Source of truth for the website's publications page.
# Keep in sync with docs/cv-src/cv/publications.tex and Google Scholar.
# Sorted reverse-chronologically; the publications page sorts by `year` anyway.
#
# `tldr` is a one-line, plain-language summary for non-specialists.
# Optional links, shown in this order: project (project page), pdf, arxiv,
# doi (bare DOI, no URL prefix), code. `bibtex` is shown in a collapsible
# block with a copy button; DOI metadata comes from Crossref.

- title: "HINT: Learning Complete Human Neural Representations from Limited Viewpoints"
  authors:
    - "A. Sanvito"
    - "A. Ramazzina"
    - "S. Walz"
    - "M. Bijelic"
    - "F. Heide"
  venue: "IEEE IV"
  venue_full: "IEEE Intelligent Vehicles Symposium"
  year: 2024
  tier: top
  first_author: true
  tldr: "Builds a complete 3D model of a person, including the sides no camera saw, from just a few views, by assuming the body is roughly left-right symmetric. Aimed at cameras inside vehicles, which only ever see people from a few angles."
  pdf: "https://arxiv.org/pdf/2405.19712"
  arxiv: "https://arxiv.org/abs/2405.19712"
  doi: "10.1109/IV55156.2024.10588836"
  bibtex: |
    @inproceedings{sanvito2024hint,
      title     = {{HINT}: Learning Complete Human Neural Representations from Limited Viewpoints},
      author    = {Sanvito, Alessandro and Ramazzina, Andrea and Walz, Stefanie and Bijelic, Mario and Heide, Felix},
      booktitle = {2024 IEEE Intelligent Vehicles Symposium (IV)},
      pages     = {1556--1563},
      year      = {2024},
      publisher = {IEEE},
      doi       = {10.1109/IV55156.2024.10588836}
    }

- title: "ScatterNeRF: Seeing Through Fog with Physically-Based Inverse Neural Rendering"
  authors:
    - "A. Ramazzina"
    - "M. Bijelic"
    - "S. Walz"
    - "A. Sanvito"
    - "D. Scheuble"
    - "F. Heide"
  venue: "ICCV"
  venue_full: "IEEE/CVF International Conference on Computer Vision"
  year: 2023
  tier: top
  first_author: false
  tldr: "Rebuilds a 3D scene from photos taken in fog and separates the fog from what is behind it, using the physics of how light scatters, so a car's cameras can see the road clearly in bad weather."
  project: "https://light.princeton.edu/publication/scatternerf/"
  pdf: "https://light.princeton.edu/wp-content/uploads/2023/09/ScatterNeRF-main.pdf"
  arxiv: "https://arxiv.org/abs/2305.02103"
  doi: "10.1109/ICCV51070.2023.01646"
  code: "https://github.com/princeton-computational-imaging/scatternerf"
  bibtex: |
    @inproceedings{ramazzina2023scatternerf,
      title     = {{ScatterNeRF}: Seeing Through Fog with Physically-Based Inverse Neural Rendering},
      author    = {Ramazzina, Andrea and Bijelic, Mario and Walz, Stefanie and Sanvito, Alessandro and Scheuble, Dominik and Heide, Felix},
      booktitle = {2023 IEEE/CVF International Conference on Computer Vision (ICCV)},
      pages     = {17911--17922},
      year      = {2023},
      publisher = {IEEE},
      doi       = {10.1109/ICCV51070.2023.01646}
    }

